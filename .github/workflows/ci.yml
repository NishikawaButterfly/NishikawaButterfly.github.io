name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Shell consistency
        run: node tools/check_shell.js
      - name: Internal links
        run: node tools/check_links.js
      - name: HTML well-formedness
        run: node tools/check_html.js
